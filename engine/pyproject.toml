[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "liveatc-digest"
version = "0.1.0.dev0"
description = "Download, transcribe, and reconstruct LiveATC.net recordings; ADS-B replay; NTSB case studies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.8",
  "platformdirs>=4.2",
  "keyring>=25.2",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
audio = ["pydub>=0.25"]
asr-openai = ["openai>=1.37"]
asr-local = ["faster-whisper>=1.0"]
dev = ["pytest>=8.2", "ruff>=0.5", "pytest-cov>=5.0"]

[project.scripts]
latc = "liveatc_digest.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["liveatc_digest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
